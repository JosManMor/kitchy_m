services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: kitchy

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/kitchy
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      HOSTNAME: 0.0.0.0
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server

volumes:
  mongo_data:
